name: Build KernelSU package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build-ksu:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: vd-server-go/go.mod
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platforms;android-$ANDROID_API"             "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Prepare fixed APK signing key
        shell: bash
        env:
          APK_SIGNING_KEYSTORE_B64: ${{ secrets.APK_SIGNING_KEYSTORE_B64 }}
          APK_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$APK_SIGNING_KEYSTORE_B64" ] || [ -z "$APK_SIGNING_PASSWORD" ]; then
            echo "Fixed APK signing secrets are not configured." >&2
            echo "Required secrets: APK_SIGNING_KEYSTORE_B64 and APK_SIGNING_PASSWORD" >&2
            exit 1
          fi

          SIGNING_KEYSTORE="$RUNNER_TEMP/agent-mobile-use.p12"
          printf '%s' "$APK_SIGNING_KEYSTORE_B64" | base64 --decode > "$SIGNING_KEYSTORE"
          chmod 600 "$SIGNING_KEYSTORE"
          echo "APK_SIGNING_KEYSTORE=$SIGNING_KEYSTORE" >> "$GITHUB_ENV"

      - name: Build hook APK
        shell: bash
        env:
          APK_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: |
          set -euxo pipefail
          chmod +x agent-hook-apk/build.sh
          ./agent-hook-apk/build.sh

      - name: Build Java tools
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x vd-tool-java/build.sh
          ./vd-tool-java/build.sh

      - name: Build Android ARM64 vd_server
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x vd-server-go/build.sh
          ./vd-server-go/build.sh

      - name: Pack complete KernelSU module
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ksu-module/pack.sh
          ./ksu-module/pack.sh

      - name: Verify outputs and report sizes
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(sed -n 's/^version=//p' ksu-module/module.prop)"
          KSU_ZIP="release/agent-mobile-use-ksu-v${VERSION}.zip"

          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" \
            verify --verbose --print-certs agent-hook-apk/build/agent_hook.apk

          APK_BADGING="$("$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging agent-hook-apk/build/agent_hook.apk)"
          printf '%s\n' "$APK_BADGING"
          grep -Fq "package: name='com.agent.mobileuse' versionCode='800' versionName='0.8.0-alpha'" <<<"$APK_BADGING"
          grep -Fq "sdkVersion:'26'" <<<"$APK_BADGING"
          grep -Fq "targetSdkVersion:'28'" <<<"$APK_BADGING"

          APK_XML="$("$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump xmltree agent-hook-apk/build/agent_hook.apk AndroidManifest.xml)"
          grep -Fq 'A: android:name(0x01010003)="xposedmodule"' <<<"$APK_XML"
          grep -Fq 'A: android:name(0x01010003)="xposedminversion"' <<<"$APK_XML"
          grep -Fq 'A: android:name(0x01010003)="xposedscope"' <<<"$APK_XML"

          file vd-server-go/vd_server | grep -q "ARM aarch64"
          test -s vd-tool-java/bin/agent_tools.dex
          test -s vd-tool-java/bin/agent_vd.dex
          unzip -t "$KSU_ZIP"

          stat -c 'agent_hook.apk bytes=%s' agent-hook-apk/build/agent_hook.apk
          stat -c 'agent_tools.dex bytes=%s' vd-tool-java/bin/agent_tools.dex
          stat -c 'agent_vd.dex bytes=%s' vd-tool-java/bin/agent_vd.dex
          stat -c 'vd_server bytes=%s' vd-server-go/vd_server
          stat -c 'ksu_zip bytes=%s' "$KSU_ZIP"

          echo '--- APK entries ---'
          unzip -l agent-hook-apk/build/agent_hook.apk
          echo '--- KSU entries ---'
          unzip -l "$KSU_ZIP"
          sha256sum "$KSU_ZIP"

      - name: Upload KernelSU package
        uses: actions/upload-artifact@v7
        with:
          name: agent-mobile-use-ksu
          path: release/agent-mobile-use-ksu-v0.8.0-alpha.zip
          if-no-files-found: error
          retention-days: 14
