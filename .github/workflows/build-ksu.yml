name: Build KernelSU package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-ksu:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install Android SDK components
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-23" "build-tools;28.0.3"

      - name: Switch to Java 8 for legacy dx builds
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare legacy build paths and Xposed API
        shell: bash
        run: |
          set -euxo pipefail

          sudo mkdir -p /usr/lib/android-sdk/platforms/android-23
          sudo mkdir -p /usr/lib/android-sdk/build-tools/debian
          sudo mkdir -p /root/xposed_lib

          sudo ln -sf "$ANDROID_HOME/platforms/android-23/android.jar"             /usr/lib/android-sdk/platforms/android-23/android.jar

          sudo ln -sf "$ANDROID_HOME/build-tools/28.0.3/dx"             /usr/lib/android-sdk/build-tools/debian/dx
          sudo ln -sf "$ANDROID_HOME/build-tools/28.0.3/aapt" /usr/bin/aapt
          sudo ln -sf "$ANDROID_HOME/build-tools/28.0.3/zipalign" /usr/bin/zipalign
          sudo ln -sf "$ANDROID_HOME/build-tools/28.0.3/apksigner" /usr/bin/apksigner

          curl -fL             https://artifactory.appodeal.com/appodeal-public/de/robv/android/xposed/api/82/api-82.jar             -o /tmp/xposed-api-stub.jar
          sudo cp /tmp/xposed-api-stub.jar /root/xposed_lib/xposed-api-stub.jar

      - name: Prepare fixed APK signing key
        shell: bash
        env:
          APK_SIGNING_KEYSTORE_B64: ${{ secrets.APK_SIGNING_KEYSTORE_B64 }}
          APK_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$APK_SIGNING_KEYSTORE_B64" ] || [ -z "$APK_SIGNING_PASSWORD" ]; then
            echo "Fixed APK signing secrets are not configured." >&2
            echo "Required secrets: APK_SIGNING_KEYSTORE_B64 and APK_SIGNING_PASSWORD" >&2
            exit 1
          fi

          SIGNING_KEYSTORE="$RUNNER_TEMP/agent-mobile-use.p12"
          printf '%s' "$APK_SIGNING_KEYSTORE_B64" | base64 --decode > "$SIGNING_KEYSTORE"
          chmod 600 "$SIGNING_KEYSTORE"
          echo "APK_SIGNING_KEYSTORE=$SIGNING_KEYSTORE" >> "$GITHUB_ENV"

      - name: Build hook APK
        shell: bash
        env:
          APK_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: |
          set -euxo pipefail
          chmod +x agent-hook-apk/build.sh
          sudo -E bash agent-hook-apk/build.sh

      - name: Build Java tools
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x vd-tool-java/build.sh
          sudo -E bash vd-tool-java/build.sh

      - name: Test and build ARM64 Android vd_server
        shell: bash
        run: |
          set -euxo pipefail
          pushd vd-server-go
          go test ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64             go build -ldflags="-s -w" -o vd_server .
          popd
          file vd-server-go/vd_server

      - name: Pack complete KernelSU module
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ksu-module/pack.sh
          bash ksu-module/pack.sh
          unzip -l agent-mobile-use-ksu.zip
          sha256sum agent-mobile-use-ksu.zip

      - name: Upload KernelSU package
        uses: actions/upload-artifact@v4
        with:
          name: agent-mobile-use-ksu-main
          path: agent-mobile-use-ksu.zip
          if-no-files-found: error
          retention-days: 14
