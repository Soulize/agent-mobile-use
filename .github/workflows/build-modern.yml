name: Modern build toolchain

on:
  push:
    branches:
      - modern-build-toolchain
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build-modern:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: vd-server-go/go.mod
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platforms;android-$ANDROID_API"             "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Build complete package with modern toolchain
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build-modern.sh
          ./build-modern.sh

      - name: Verify outputs
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"             verify --verbose agent-hook-apk/build/agent_hook.apk
          file vd-server-go/vd_server | grep -q "ARM aarch64"
          test -s vd-tool-java/bin/agent_tools.dex
          test -s vd-tool-java/bin/agent_vd.dex
          unzip -t release/agent-mobile-use-ksu-v0.8.0-alpha.zip
          sha256sum release/agent-mobile-use-ksu-v0.8.0-alpha.zip

      - name: Upload KernelSU package
        uses: actions/upload-artifact@v4
        with:
          name: agent-mobile-use-ksu-modern-build
          path: release/agent-mobile-use-ksu-v0.8.0-alpha.zip
          if-no-files-found: error
          retention-days: 14
